name: train-ai
on:
  schedule:
    - cron: "17 20 * * 0"   # 毎週月曜 5:17 JST
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["ai/features.py", "ai/train.py", "ai/common.py", "ai/comment_cls.py", "ai/line.py", "ai/predict.py", ".github/workflows/train-ai.yml"]

permissions:
  contents: write

concurrency:
  group: train-ai
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r ai/requirements.txt
      - run: bash tools/data_branch.sh checkout
      - run: python -m ai.train --data data
      - run: |
          cd data && git checkout -- state 2>/dev/null || true; cd ..
          bash tools/data_branch.sh push "model"
