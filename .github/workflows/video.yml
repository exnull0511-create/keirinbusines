name: video
on:
  workflow_dispatch:
    inputs:
      days: { default: "30" }
      limit: { default: "1000" }
      workers: { default: "1" }
  push:
    branches: ["claude/video-kick"]

permissions:
  contents: write

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests && sudo apt-get install -y -qq ffmpeg
      - run: bash tools/data_branch.sh checkout
      - run: |
          python -m collector.video run --data data --minutes 320 \
            --days "${{ github.event.inputs.days || '3' }}" \
            --limit "${{ github.event.inputs.limit || '3' }}" \
            --workers "${{ github.event.inputs.workers || '1' }}"
      - if: always()
        run: bash tools/data_branch.sh push "video"
