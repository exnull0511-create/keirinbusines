name: video
on:
  workflow_dispatch:
    inputs:
      days: { default: "8" }
      limit: { default: "100", description: "1系統あたりの上限レース数" }
      workers: { default: "8", description: "1系統あたりの同時実行数" }
  push:
    branches: ["claude/video-kick"]

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]   # 3系統に均等に分けて同時に回す
    concurrency:
      group: video-${{ matrix.shard }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: bash tools/data_branch.sh checkout
      - run: |
          python -m collector.video run --data data --minutes 320 --shard ${{ matrix.shard }} --shards 3 \
            --days "${{ github.event.inputs.days || '3' }}" \
            --limit "${{ github.event.inputs.limit || '1' }}" \
            --workers "${{ github.event.inputs.workers || '1' }}"
      - if: always()
        run: bash tools/data_branch.sh push "video shard ${{ matrix.shard }}"
