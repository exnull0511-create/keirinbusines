name: weather
on:
  schedule:
    - cron: "40 */3 * * *"   # 3時間ごと（全場そろうまで。そろった後は差分だけ取るので軽い）
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["collector/weather.py", ".github/workflows/weather.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: weather-writer
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r collector/requirements.txt
      - run: bash tools/data_branch.sh checkout
      - run: python -m collector.weather --data data --start 2024-01-01
      - if: always()
        run: bash tools/data_branch.sh push "weather"
      - name: 見張り係を起こす（定期実行が飛んでも健康チェックが止まらないよう、いろいろな仕組みから起動する）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run health.yml --ref main || true
