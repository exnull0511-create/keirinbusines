name: odds-watch
# 締切前のオッズ監視（collector/watch.py）。1日中途切れずに動かし、1回の上限（約6時間）が近づいたら次の回を自分で起動する。
# その日のレースが終わったら翌朝7:50まで待機して次の回を起動する（GitHubの定期実行は30分〜1時間半遅れることがあるため、朝の起動に使わない）。
# 定期実行は止まってしまったときの予備（監視がすでに動いていれば予備は何もせず終わる）。
# 引き継ぎ: 新しい回はレース一覧を取ってから「引き継ぎ待ち」に入り、前の回はそれを見て保存して終わる（詳しくは collector/watch.py）。
# そのため同時に2つ動けるように concurrency は付けない。
on:
  schedule:
    - cron: "20 23 * * *"   # 8:20 JST
    - cron: "50 0 * * *"    # 9:50 JST（予備）
    - cron: "20 3 * * *"    # 12:20 JST（予備）
    - cron: "20 6 * * *"    # 15:20 JST（予備）
    - cron: "20 9 * * *"    # 18:20 JST（予備）
    - cron: "20 12 * * *"   # 21:20 JST（予備）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"   # 1回の上限をジョブ開始から数えるため
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r collector/requirements.txt -r ai/requirements.txt
      - run: bash tools/data_branch.sh checkout
      - name: 準備
        run: python -u -m collector.watch --data data --prepare
      - name: 引き継ぎ待ち
        run: python -u -m collector.watch --data data --wait
      - name: 監視
        run: python -u -m collector.watch --data data
      - if: always()
        run: |
          cd data && git checkout -- state 2>/dev/null || true; git clean -fdq state 2>/dev/null || true; cd ..
          bash tools/data_branch.sh push "odds watch"
      - name: 次の回を起動
        if: always()
        run: |
          # 起動に失敗すると監視が途切れるので、数回やり直す
          if [ -f /tmp/odds_watch_continue ]; then
            for i in 1 2 3 4 5; do gh workflow run odds-watch.yml --ref "${GITHUB_REF_NAME}" && { echo "次の回を起動"; break; }; sleep $((i * 15)); done
          fi
